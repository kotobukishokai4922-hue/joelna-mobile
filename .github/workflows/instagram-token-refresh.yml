name: Instagram トークン更新

on:
  schedule:
    - cron: "43 0 * * 1"   # 毎週月曜 09:43（日本時間）。長期トークンは60日で失効するため週1回更新
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
        run: node scripts/instagram/ig.mjs refresh-token
