name: Instagram 自動投稿

on:
  schedule:
    - cron: "17 * * * *"   # 毎時17分（UTC）に予約投稿を確認。GitHubの都合で数分〜十数分遅れることがある
  workflow_dispatch:
    inputs:
      command:
        description: "実行するコマンド"
        required: true
        default: "publish"
        type: choice
        options: [publish, "publish --dry-run", status, validate, refresh-token]

concurrency:
  group: instagram-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 実行
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          IG_MEDIA_BASE_URL: ${{ vars.IG_MEDIA_BASE_URL }}
        run: node scripts/instagram/ig.mjs ${{ github.event.inputs.command || 'publish' }}
      - name: 公開結果をキューに記録
        if: always()
        run: |
          if ! git diff --quiet instagram/queue.json; then
            git config user.name "joelna-instagram-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add instagram/queue.json
            git commit -m "Instagram: 公開結果を記録"
            git push
          fi
